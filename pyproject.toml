[project]
name = "git-cleanup"
version = "0.3.0"
description = "Interactively clean up merged, done, and stale git branches using your issue tracker"
readme = "README.md"
authors = [
    { name = "Brent O'Connor", email = "epicserve@gmail.com" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["git", "branches", "worktrees", "stashes", "cleanup", "tui", "jira"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "httpx>=0.28",
    "rich>=13",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/epicserve/git-cleanup"
Repository = "https://github.com/epicserve/git-cleanup"
Issues = "https://github.com/epicserve/git-cleanup/issues"
Changelog = "https://github.com/epicserve/git-cleanup/blob/main/CHANGELOG.md"

[project.scripts]
git-cleanup = "git_cleanup.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "respx>=0.22",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
